apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: rustfs-data
    namespace: hw5
  spec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 2Gi
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: rustfs
    namespace: hw5
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: rustfs
    template:
      metadata:
        labels:
          app: rustfs
      spec:
        securityContext:
          fsGroup: 10001
        containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          imagePullPolicy: IfNotPresent
          args:
          - "/data"
          env:
          - name: RUSTFS_ACCESS_KEY
            value: hw5admin
          - name: RUSTFS_SECRET_KEY
            value: hw5-local-secret
          - name: RUSTFS_CONSOLE_ENABLE
            value: 'false'
          ports:
          - containerPort: 9000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1Gi
          volumeMounts:
          - name: data
            mountPath: "/data"
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 3
            periodSeconds: 3
        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
- apiVersion: v1
  kind: Service
  metadata:
    name: rustfs
    namespace: hw5
  spec:
    selector:
      app: rustfs
    ports:
    - port: 9000
      targetPort: 9000
