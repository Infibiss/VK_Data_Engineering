apiVersion: v1
kind: Pod
metadata:
  name: quota-first
  namespace: hw5-quota
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
  - name: task
    image: hw5-job:local
    imagePullPolicy: Never
    command:
    - python
    - "-c"
    - import time; time.sleep(600)
    resources:
      requests:
        cpu: 300m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 128Mi
