apiVersion: v1
kind: Pod
metadata:
  name: cpu-waiter
  namespace: hw5-scheduling
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
  - name: task
    image: hw5-job:local
    imagePullPolicy: Never
    command:
    - python
    - "-c"
    - import time; time.sleep(600)
    resources:
      requests:
        cpu: '2'
        memory: 64Mi
      limits:
        cpu: '2'
        memory: 128Mi
  priorityClassName: hw5-low
